<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手取り計算｜生活のお金計算</title><meta name="description" content="月給・賞与から毎月の手取り額を概算します。"><link rel="stylesheet" href="../assets/styles.css"></head><body data-tool="takehome"><header class="site-header"><div class="wrap header-inner"><a class="brand" href="../index.html">生活の<span>お金計算</span></a><a class="nav-home" href="../index.html">ツール一覧</a></div></header><main class="page"><div class="wrap"><div class="page-title"><div class="pill">無料・登録不要・ブラウザ内計算</div><h1>手取り計算</h1><p>月給・賞与から社会保険料と税金を差し引いた手取り額を概算します。</p></div><div class="calc-layout"><section class="panel"><h2>入力</h2><div class="field"><label>月給（額面）</label><div class="input-wrap"><input id="gross" type="number" inputmode="decimal" value="300000"><span class="unit">円</span></div></div><div class="field"><label>年間賞与（額面）</label><div class="input-wrap"><input id="bonus" type="number" inputmode="decimal" value="600000"><span class="unit">円</span></div></div><div class="field"><label>社会保険料の概算率</label><div class="input-wrap"><input id="social" type="number" inputmode="decimal" value="15" step="0.1"><span class="unit">%</span></div></div><div class="actions"><button class="btn btn-primary" onclick="run()">計算する</button><button class="btn btn-sub" onclick="location.reload()">リセット</button></div></section><aside class="result"><h2>計算結果</h2><div class="result-main"><div class="result-label">毎月の手取り目安</div><div class="result-value" id="main">—</div></div><div class="result-list"><div class="result-row"><span>年間手取り</span><strong id="r1">—</strong></div><div class="result-row"><span>社会保険料</span><strong id="r2">—</strong></div><div class="result-row"><span>所得税等</span><strong id="r3">—</strong></div><div class="result-row"><span>住民税</span><strong id="r4">—</strong></div></div><p class="note">扶養や控除、保険料率などで実際の金額は変わります。</p></aside></div><div class="ad-slot">広告掲載スペース（現在は広告なし）</div></div></main><footer class="footer"><div class="wrap"><a href="../privacy.html">プライバシーポリシー</a></div></footer><script src="../assets/app.js"></script></body></html>

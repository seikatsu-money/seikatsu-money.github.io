<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>車の年間維持費計算｜生活のお金計算</title><meta name="description" content="車のローン・燃料・保険・税金・駐車場などから年間維持費を計算します。"><link rel="stylesheet" href="../assets/styles.css"></head><body data-tool="car"><header class="site-header"><div class="wrap header-inner"><a class="brand" href="../index.html">生活の<span>お金計算</span></a><a class="nav-home" href="../index.html">ツール一覧</a></div></header><main class="page"><div class="wrap"><div class="page-title"><div class="pill">無料・登録不要</div><h1>車の年間維持費</h1><p>ローン、燃料、保険、税金、車検などをまとめて計算します。</p></div><div class="calc-layout"><section class="panel"><h2>入力</h2><div class="field"><label>月々のローン</label><div class="input-wrap"><input id="loan" type="number" value="30000"><span class="unit">円</span></div></div><div class="field"><label>月々の駐車場</label><div class="input-wrap"><input id="parking" type="number" value="10000"><span class="unit">円</span></div></div><div class="field"><label>年間保険料</label><div class="input-wrap"><input id="insurance" type="number" value="80000"><span class="unit">円</span></div></div><div class="field"><label>年間自動車税</label><div class="input-wrap"><input id="tax" type="number" value="35000"><span class="unit">円</span></div></div><div class="field"><label>車検費用（2年分）</label><div class="input-wrap"><input id="inspection" type="number" value="120000"><span class="unit">円</span></div></div><div class="field"><label>年間走行距離</label><div class="input-wrap"><input id="km" type="number" value="10000"><span class="unit">km</span></div></div><div class="field"><label>燃費</label><div class="input-wrap"><input id="eff" type="number" value="15" step="0.1"><span class="unit">km/L</span></div></div><div class="field"><label>ガソリン単価</label><div class="input-wrap"><input id="gas" type="number" value="175"><span class="unit">円/L</span></div></div><div class="field"><label>年間メンテナンス</label><div class="input-wrap"><input id="maint" type="number" value="50000"><span class="unit">円</span></div></div></section><aside class="result"><h2>計算結果</h2><div class="result-main"><div class="result-label">年間維持費</div><div class="result-value" id="main">—</div></div><div class="result-row"><span>月平均</span><strong id="r1">—</strong></div><div class="result-row"><span>年間燃料費</span><strong id="r2">—</strong></div><div class="result-row"><span>年間ローン</span><strong id="r3">—</strong></div></aside></div></div></main><script src="../assets/app.js"></script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>結婚後の生活費計算｜生活のお金計算</title><meta name="description" content="2人暮らしの生活費と負担額を計算します。"><link rel="stylesheet" href="../assets/styles.css"></head><body data-tool="couple"><header class="site-header"><div class="wrap header-inner"><a class="brand" href="../index.html">生活の<span>お金計算</span></a><a class="nav-home" href="../index.html">ツール一覧</a></div></header><main class="page"><div class="wrap"><div class="page-title"><div class="pill">無料・登録不要</div><h1>結婚後の生活費</h1><p>2人暮らしの費用を合計し、負担割合ごとの金額も確認できます。</p></div><div class="calc-layout"><section class="panel"><h2>入力</h2><div class="field"><label>家賃</label><div class="input-wrap"><input id="rent" type="number" value="100000"><span class="unit">円</span></div></div><div class="field"><label>食費</label><div class="input-wrap"><input id="food" type="number" value="60000"><span class="unit">円</span></div></div><div class="field"><label>水道光熱費</label><div class="input-wrap"><input id="utility" type="number" value="18000"><span class="unit">円</span></div></div><div class="field"><label>通信費</label><div class="input-wrap"><input id="phone" type="number" value="12000"><span class="unit">円</span></div></div><div class="field"><label>交通費</label><div class="input-wrap"><input id="transport" type="number" value="20000"><span class="unit">円</span></div></div><div class="field"><label>保険</label><div class="input-wrap"><input id="insurance" type="number" value="15000"><span class="unit">円</span></div></div><div class="field"><label>娯楽・交際費</label><div class="input-wrap"><input id="fun" type="number" value="30000"><span class="unit">円</span></div></div><div class="field"><label>その他</label><div class="input-wrap"><input id="other" type="number" value="10000"><span class="unit">円</span></div></div><div class="field"><label>自分の負担割合</label><div class="input-wrap"><input id="share" type="number" value="50"><span class="unit">%</span></div></div></section><aside class="result"><h2>計算結果</h2><div class="result-main"><div class="result-label">2人の毎月生活費</div><div class="result-value" id="main">—</div></div><div class="result-row"><span>自分の負担</span><strong id="r1">—</strong></div><div class="result-row"><span>相手の負担</span><strong id="r2">—</strong></div><div class="result-row"><span>年間生活費</span><strong id="r3">—</strong></div></aside></div></div></main><script src="../assets/app.js"></script></body></html>

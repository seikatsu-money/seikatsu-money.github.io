<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一人暮らし生活費計算｜生活のお金計算</title><meta name="description" content="一人暮らしに必要な毎月の生活費を計算します。"><link rel="stylesheet" href="../assets/styles.css"></head><body data-tool="solo"><header class="site-header"><div class="wrap header-inner"><a class="brand" href="../index.html">生活の<span>お金計算</span></a><a class="nav-home" href="../index.html">ツール一覧</a></div></header><main class="page"><div class="wrap"><div class="page-title"><div class="pill">無料・登録不要</div><h1>一人暮らし生活費</h1><p>家賃や食費などを合計して、毎月の残りも確認できます。</p></div><div class="calc-layout"><section class="panel"><h2>入力</h2><div class="field"><label>毎月の手取り</label><div class="input-wrap"><input id="income" type="number" value="250000"><span class="unit">円</span></div></div><div class="field"><label>家賃</label><div class="input-wrap"><input id="rent" type="number" value="70000"><span class="unit">円</span></div></div><div class="field"><label>食費</label><div class="input-wrap"><input id="food" type="number" value="35000"><span class="unit">円</span></div></div><div class="field"><label>水道光熱費</label><div class="input-wrap"><input id="utility" type="number" value="12000"><span class="unit">円</span></div></div><div class="field"><label>通信費</label><div class="input-wrap"><input id="phone" type="number" value="8000"><span class="unit">円</span></div></div><div class="field"><label>交通費</label><div class="input-wrap"><input id="transport" type="number" value="10000"><span class="unit">円</span></div></div><div class="field"><label>日用品</label><div class="input-wrap"><input id="daily" type="number" value="8000"><span class="unit">円</span></div></div><div class="field"><label>娯楽・交際費</label><div class="input-wrap"><input id="fun" type="number" value="20000"><span class="unit">円</span></div></div><div class="field"><label>その他</label><div class="input-wrap"><input id="other" type="number" value="10000"><span class="unit">円</span></div></div></section><aside class="result"><h2>計算結果</h2><div class="result-main"><div class="result-label">毎月の生活費</div><div class="result-value" id="main">—</div></div><div class="result-row"><span>年間生活費</span><strong id="r1">—</strong></div><div class="result-row"><span>家賃以外</span><strong id="r2">—</strong></div><div class="result-row"><span>毎月の残り</span><strong id="r3">—</strong></div></aside></div></div></main><script src="../assets/app.js"></script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>食費予算計算｜生活のお金計算</title><meta name="description" content="手取りと目標割合から月・週・日の食費予算を計算します。"><link rel="stylesheet" href="../assets/styles.css"></head><body data-tool="food"><header class="site-header"><div class="wrap header-inner"><a class="brand" href="../index.html">生活の<span>お金計算</span></a><a class="nav-home" href="../index.html">ツール一覧</a></div></header><main class="page"><div class="wrap"><div class="page-title"><div class="pill">無料・登録不要</div><h1>食費予算計算</h1><p>手取りの何％を食費に使うか決めて、月・週・日の予算を確認します。</p></div><div class="calc-layout"><section class="panel"><h2>入力</h2><div class="field"><label>毎月の手取り</label><div class="input-wrap"><input id="take" type="number" value="250000"><span class="unit">円</span></div></div><div class="field"><label>食費の目標割合</label><select id="ratio"><option value="10">10%</option><option value="12">12%</option><option value="15" selected>15%</option><option value="18">18%</option><option value="20">20%</option></select></div></section><aside class="result"><h2>計算結果</h2><div class="result-main"><div class="result-label">毎月の食費予算</div><div class="result-value" id="main">—</div></div><div class="result-row"><span>1日あたり</span><strong id="r1">—</strong></div><div class="result-row"><span>1週間あたり</span><strong id="r2">—</strong></div><div class="result-row"><span>年間</span><strong id="r3">—</strong></div></aside></div></div></main><script src="../assets/app.js"></script></body></html>

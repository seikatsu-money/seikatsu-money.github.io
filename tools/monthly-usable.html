<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>年収から毎月使える金額計算｜生活のお金計算</title><meta name="description" content="年収から毎月自由に使える金額の目安を計算します。"><link rel="stylesheet" href="../assets/styles.css"></head><body data-tool="usable"><header class="site-header"><div class="wrap header-inner"><a class="brand" href="../index.html">生活の<span>お金計算</span></a><a class="nav-home" href="../index.html">ツール一覧</a></div></header><main class="page"><div class="wrap"><div class="page-title"><div class="pill">無料・登録不要</div><h1>年収から毎月使える金額</h1><p>年収の手取り目安から、貯金・投資と固定費を引いた自由費を計算します。</p></div><div class="calc-layout"><section class="panel"><h2>入力</h2><div class="field"><label>年収（額面）</label><div class="input-wrap"><input id="annual" type="number" value="4500000"><span class="unit">円</span></div></div><div class="field"><label>想定手取り率</label><div class="input-wrap"><input id="netrate" type="number" value="78"><span class="unit">%</span></div></div><div class="field"><label>毎月の貯金・投資</label><div class="input-wrap"><input id="saving" type="number" value="30000"><span class="unit">円</span></div></div><div class="field"><label>毎月の固定費</label><div class="input-wrap"><input id="fixed" type="number" value="130000"><span class="unit">円</span></div></div></section><aside class="result"><h2>計算結果</h2><div class="result-main"><div class="result-label">毎月自由に使える目安</div><div class="result-value" id="main">—</div></div><div class="result-row"><span>毎月の手取り目安</span><strong id="r1">—</strong></div><div class="result-row"><span>貯金・投資</span><strong id="r2">—</strong></div><div class="result-row"><span>固定費</span><strong id="r3">—</strong></div><div class="result-row"><span>1日あたり自由費</span><strong id="r4">—</strong></div></aside></div></div></main><script src="../assets/app.js"></script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>貯金可能額計算｜生活のお金計算</title><meta name="description" content="収入と支出から毎月いくら貯金できるか計算します。"><link rel="stylesheet" href="../assets/styles.css"></head><body data-tool="savings"><header class="site-header"><div class="wrap header-inner"><a class="brand" href="../index.html">生活の<span>お金計算</span></a><a class="nav-home" href="../index.html">ツール一覧</a></div></header><main class="page"><div class="wrap"><div class="page-title"><div class="pill">無料・登録不要</div><h1>貯金可能額</h1><p>手取りから固定費と変動費を引き、毎月残せる金額を計算します。</p></div><div class="calc-layout"><section class="panel"><h2>入力</h2><div class="field"><label>毎月の手取り</label><div class="input-wrap"><input id="income" type="number" value="250000"><span class="unit">円</span></div></div><div class="field"><label>固定費</label><div class="input-wrap"><input id="fixed" type="number" value="120000"><span class="unit">円</span></div></div><div class="field"><label>変動費</label><div class="input-wrap"><input id="variable" type="number" value="90000"><span class="unit">円</span></div></div></section><aside class="result"><h2>計算結果</h2><div class="result-main"><div class="result-label">毎月の貯金可能額</div><div class="result-value" id="main">—</div></div><div class="result-row"><span>年間</span><strong id="r1">—</strong></div><div class="result-row"><span>貯蓄率</span><strong id="r2">—</strong></div><div class="result-row"><span>収支</span><strong id="r3">—</strong></div></aside></div></div></main><script src="../assets/app.js"></script></body></html>

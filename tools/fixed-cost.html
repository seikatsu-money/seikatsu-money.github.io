<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>固定費合計計算｜生活のお金計算</title><meta name="description" content="家賃・通信・保険・サブスクなど毎月の固定費を合計します。"><link rel="stylesheet" href="../assets/styles.css"></head><body data-tool="fixed"><header class="site-header"><div class="wrap header-inner"><a class="brand" href="../index.html">生活の<span>お金計算</span></a><a class="nav-home" href="../index.html">ツール一覧</a></div></header><main class="page"><div class="wrap"><div class="page-title"><div class="pill">無料・登録不要</div><h1>固定費合計</h1><p>毎月必ず出ていくお金をまとめて見える化します。</p></div><div class="calc-layout"><section class="panel"><h2>入力</h2><div class="field"><label>毎月の手取り</label><div class="input-wrap"><input id="income" type="number" value="250000"><span class="unit">円</span></div></div><div class="field"><label>家賃</label><div class="input-wrap"><input id="rent" type="number" value="70000"><span class="unit">円</span></div></div><div class="field"><label>通信費</label><div class="input-wrap"><input id="phone" type="number" value="8000"><span class="unit">円</span></div></div><div class="field"><label>水道光熱費</label><div class="input-wrap"><input id="utility" type="number" value="12000"><span class="unit">円</span></div></div><div class="field"><label>保険</label><div class="input-wrap"><input id="insurance" type="number" value="10000"><span class="unit">円</span></div></div><div class="field"><label>サブスク</label><div class="input-wrap"><input id="subs" type="number" value="5000"><span class="unit">円</span></div></div><div class="field"><label>ローン</label><div class="input-wrap"><input id="loan" type="number" value="30000"><span class="unit">円</span></div></div><div class="field"><label>駐車場</label><div class="input-wrap"><input id="parking" type="number" value="10000"><span class="unit">円</span></div></div><div class="field"><label>その他</label><div class="input-wrap"><input id="other" type="number" value="5000"><span class="unit">円</span></div></div></section><aside class="result"><h2>計算結果</h2><div class="result-main"><div class="result-label">毎月の固定費</div><div class="result-value" id="main">—</div></div><div class="result-row"><span>年間固定費</span><strong id="r1">—</strong></div><div class="result-row"><span>固定費を引いた残り</span><strong id="r2">—</strong></div><div class="result-row"><span>固定費率</span><strong id="r3">—</strong></div></aside></div></div></main><script src="../assets/app.js"></script></body></html>

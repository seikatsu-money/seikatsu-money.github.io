<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>子ども1人の生活費計算｜生活のお金計算</title><meta name="description" content="教育費・食費・衣服・習い事など、子ども1人にかかる毎月の費用を計算します。"><link rel="stylesheet" href="../assets/styles.css"></head><body data-tool="child"><header class="site-header"><div class="wrap header-inner"><a class="brand" href="../index.html">生活の<span>お金計算</span></a><a class="nav-home" href="../index.html">ツール一覧</a></div></header><main class="page"><div class="wrap"><div class="page-title"><div class="pill">無料・登録不要</div><h1>子ども1人の生活費</h1><p>教育・食費・衣服・医療・習い事などの月額をまとめます。</p></div><div class="calc-layout"><section class="panel"><h2>入力</h2><div class="field"><label>教育費</label><div class="input-wrap"><input id="school" type="number" value="15000"><span class="unit">円</span></div></div><div class="field"><label>食費</label><div class="input-wrap"><input id="food" type="number" value="15000"><span class="unit">円</span></div></div><div class="field"><label>衣服</label><div class="input-wrap"><input id="clothes" type="number" value="5000"><span class="unit">円</span></div></div><div class="field"><label>医療</label><div class="input-wrap"><input id="medical" type="number" value="3000"><span class="unit">円</span></div></div><div class="field"><label>習い事</label><div class="input-wrap"><input id="lesson" type="number" value="10000"><span class="unit">円</span></div></div><div class="field"><label>将来用の積立</label><div class="input-wrap"><input id="saving" type="number" value="10000"><span class="unit">円</span></div></div><div class="field"><label>その他</label><div class="input-wrap"><input id="other" type="number" value="5000"><span class="unit">円</span></div></div></section><aside class="result"><h2>計算結果</h2><div class="result-main"><div class="result-label">毎月の費用</div><div class="result-value" id="main">—</div></div><div class="result-row"><span>年間</span><strong id="r1">—</strong></div><div class="result-row"><span>18年間の単純合計</span><strong id="r2">—</strong></div><p class="note">年齢や進学先によって実際の費用は大きく変わります。</p></aside></div></div></main><script src="../assets/app.js"></script></body></html>

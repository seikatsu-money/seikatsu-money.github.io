<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家賃目安計算｜生活のお金計算</title><meta name="description" content="手取りから無理しにくい家賃の目安を計算します。"><link rel="stylesheet" href="../assets/styles.css"></head><body data-tool="rent"><header class="site-header"><div class="wrap header-inner"><a class="brand" href="../index.html">生活の<span>お金計算</span></a><a class="nav-home" href="../index.html">ツール一覧</a></div></header><main class="page"><div class="wrap"><div class="page-title"><div class="pill">無料・登録不要</div><h1>家賃目安計算</h1><p>毎月の手取りと家賃割合から、家賃の目安を計算します。</p></div><div class="calc-layout"><section class="panel"><h2>入力</h2><div class="field"><label>毎月の手取り</label><div class="input-wrap"><input id="take" type="number" inputmode="decimal" value="250000"><span class="unit">円</span></div></div><div class="field"><label>家賃に使う割合</label><select id="ratio"><option value="25">25%（余裕重視）</option><option value="30">30%（標準）</option><option value="33">33%（上限寄り）</option></select></div></section><aside class="result"><h2>計算結果</h2><div class="result-main"><div class="result-label">家賃の目安</div><div class="result-value" id="main">—</div></div><div class="result-list"><div class="result-row"><span>年間家賃</span><strong id="r1">—</strong></div><div class="result-row"><span>手取りに占める割合</span><strong id="r2">—</strong></div><div class="result-row"><span>家賃を引いた残り</span><strong id="r3">—</strong></div></div></aside></div><div class="ad-slot">広告掲載スペース（現在は広告なし）</div></div></main><script src="../assets/app.js"></script></body></html>
